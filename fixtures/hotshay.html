<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#E63946">
<title>Hot Shay | UAE Street Food</title>
<style>
  :root {
    --primary-color: #E63946;
    --accent-color: #C1121F;
    --btn-bg: #E63946;
  }
  body { font-family: Arial, sans-serif; background: #ffffff; color: #1a1a1a; }
  .btn, button.primary { background-color: #E63946; color: #fff; border-radius: 4px; padding: 10px 20px; border: none; cursor: pointer; }
  .btn:hover { background-color: #C1121F; }
  nav, .header { background: #E63946; }
  nav a { color: #fff; }
  .logo { border: 2px solid #E63946; }
  .order-btn { background: #E63946; }
  a { color: #C1121F; }
</style>
</head>
<body>

<header class="header">
  <div class="logo"><img src="/images/hotshay-logo.png" alt="Hot Shay" /></div>
  <nav>
    <a href="/">Home</a>
    <a href="/menu">Menu</a>
    <a href="/locations">Locations</a>
    <a href="/order">Order Now</a>
    <a href="/contact">Contact</a>
  </nav>
  <div class="social-icons">
    <a href="https://www.facebook.com/hotshayuae" aria-label="Facebook">
      <i class="fab fa-facebook-f"></i>
    </a>
    <a href="https://www.instagram.com/hotshay/" aria-label="Instagram">
      <i class="fab fa-instagram"></i>
    </a>
    <a href="https://www.tiktok.com/@hotshay" aria-label="TikTok">
      <i class="fab fa-tiktok"></i>
    </a>
    <a href="https://wa.me/97142345678" aria-label="WhatsApp">
      <i class="fab fa-whatsapp"></i>
    </a>
  </div>
</header>

<!-- Hero -->
<section class="hero" style="background-color: #E63946; padding: 60px 20px; color: #ffffff;">
  <h1>UAE's Favourite Street Food</h1>
  <p>Crispy shawarma, loaded fries and fresh juices delivered to your door</p>
  <a href="/order" class="btn order-btn">Order Now</a>
</section>

<!-- Menu highlights -->
<nav class="main-menu">
  <ul>
    <li><a href="/menu/wraps">Wraps &amp; Rolls</a></li>
    <li><a href="/menu/fries">Loaded Fries</a></li>
    <li><a href="/menu/drinks">Fresh Juices</a></li>
    <li><a href="/menu/combos">Combo Deals</a></li>
  </ul>
</nav>

<!-- Footer -->
<footer style="background: #C1121F; color: #fff; padding: 30px;">
  <div class="footer-social">
    <a href="https://www.facebook.com/hotshayuae">
      <i class="fab fa-facebook-f"></i> Facebook
    </a>
    <a href="https://www.instagram.com/hotshay/">
      <i class="fab fa-instagram"></i> Instagram
    </a>
    <a href="https://www.tiktok.com/@hotshay">
      <i class="fab fa-tiktok"></i> TikTok
    </a>
    <a href="https://wa.me/97142345678">
      <i class="fab fa-whatsapp"></i> WhatsApp
    </a>
  </div>
  <div class="footer-contact">
    <p>Dubai, UAE</p>
    <p>hello@hotshay.com</p>
  </div>
</footer>

</body>
</html>
